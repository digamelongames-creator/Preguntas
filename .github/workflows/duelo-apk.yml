name: APK Duelo de Preguntas
on:
  push:
    branches: [main]
    paths: ['duelo/**', '.github/workflows/duelo-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duelo-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duelo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Publicar la APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DueloDePreguntas.apk
          gh release delete duelo-apk --yes --cleanup-tag || true
          gh release create duelo-apk DueloDePreguntas.apk --latest \
            --title "Duelo de Preguntas (versión ${{ github.run_number }})" \
            --notes "Descarga DueloDePreguntas.apk desde el móvil e instálala. Si ya la tienes, se instala encima conservando la sesión."
      - name: Publicar la actualización automática
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd www && zip -qr ../bundle.zip .)
          NATIVO=$(grep -oP 'NATIVO = \K[0-9]+' src/app.js)
          printf '{"version":%s,"nativo":%s,"url":"https://github.com/${{ github.repository }}/releases/download/duelo-web/bundle.zip"}\n' "${{ github.run_number }}" "$NATIVO" > version.json
          cat version.json
          gh release delete duelo-web --yes --cleanup-tag || true
          gh release create duelo-web bundle.zip version.json --latest=false \
            --title "Duelo de Preguntas: actualización ${{ github.run_number }}" \
            --notes "Contenido que la app descarga sola al abrirse. No hace falta descargar nada de aquí."
      - name: Publicar en www.oposinator.com/duelo
        # Copia la actualización (y la APK si cambia la parte nativa) a web/duelo; Cloudflare lo publica al recibir el commit.
        run: |
          mkdir -p ../web/duelo
          NATIVO=$(grep -oP 'NATIVO = \K[0-9]+' src/app.js)
          cp bundle.zip ../web/duelo/bundle.zip
          printf '{"version":%s,"nativo":%s,"url":"https://www.oposinator.com/duelo/bundle.zip"}\n' "${{ github.run_number }}" "$NATIVO" > ../web/duelo/version.json
          if [ ! -f ../web/duelo/DueloDePreguntas.apk ] || [ "$(cat ../web/duelo/nativo.txt 2>/dev/null)" != "$NATIVO" ]; then
            cp DueloDePreguntas.apk ../web/duelo/DueloDePreguntas.apk
            echo "$NATIVO" > ../web/duelo/nativo.txt
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/duelo
          git commit -m "Duelo: publicar actualización ${{ github.run_number }} en oposinator.com" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with:
          name: DueloDePreguntas
          path: duelo/DueloDePreguntas.apk
