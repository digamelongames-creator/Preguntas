<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mazos Oposición</title>
<meta name="theme-color" content="#1d5fae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: AnkiDroid — barra superior fija, lista de mazos a ancho completo, botón flotante, cajón lateral.
   La pantalla de preguntas adopta la tarjeta de «Repaso Policía Nacional» (IBM Plex, opciones a/b/c). */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f6f8fb; --line:#dde3ec;
  --fg:#1b2230; --muted:#667085; --bar:#1d5fae; --barfg:#ffffff;
  --new:#1d5fae; --learn:#c62828; --rev:#2e7d32; --hard:#6b7280; --easy:#1d5fae;
  --zero:#b7bfcc; --accent:#1d5fae; --onaccent:#ffffff; --heat0:#e3e8f0; --heat:#1d5fae;
  --young:#7fb383; --mature:#2e7d32; --shadow:0 2px 6px rgba(20,40,80,.18);
  /* tarjeta de repaso */
  --rv-bg:#f4f5f8; --rv-card:#ffffff; --rv-raised:#ffffff; --rv-text:#1a2130; --rv-muted:#626c7d; --rv-border:#dfe2e9;
  --rv-accent:#1e3a6d; --rv-accent-ink:#ffffff; --rv-accent-soft:#e7ecf6;
  --ok:#157a3d; --ok-bg:#e4f6ea; --ok-border:#8fd2ab; --ko:#b3261e; --ko-bg:#fbe8e7; --ko-border:#eda9a5;
  --warn:#a8690a; --warn-bg:#faf0dd; --imp:#6b4fa0; --imp-bg:#efe8fa;
  --rv-shadow:0 1px 2px rgba(20,26,40,.06),0 8px 24px -12px rgba(20,26,40,.18);
  --f-ui:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-card:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,monospace;
  --f-rv:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-rvm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1b1f26; --surface2:#232832; --line:#2e3542;
  --fg:#e6e9ef; --muted:#97a1b2; --bar:#1e2a3b; --barfg:#e6e9ef;
  --new:#6aa8f2; --learn:#f07070; --rev:#72c47e; --hard:#9aa3b1; --easy:#6aa8f2;
  --zero:#4a5262; --accent:#6aa8f2; --onaccent:#0e1a2b; --heat0:#262c37; --heat:#6aa8f2;
  --young:#4f8a56; --mature:#72c47e; --shadow:0 2px 8px rgba(0,0,0,.5);
  --rv-bg:#10131a; --rv-card:#171b25; --rv-raised:#1d2230; --rv-text:#e7eaf1; --rv-muted:#9aa3b5; --rv-border:#2b3244;
  --rv-accent:#7fa0d8; --rv-accent-ink:#0d1420; --rv-accent-soft:#212b42;
  --ok:#6fd99a; --ok-bg:#123322; --ok-border:#2c6b48; --ko:#f2948d; --ko-bg:#3a1b1c; --ko-border:#7a3934;
  --warn:#e0ab5a; --warn-bg:#3a2c0e; --imp:#c3aeef; --imp-bg:#2a2242;
  --rv-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1b1f26; --surface2:#232832; --line:#2e3542;
  --fg:#e6e9ef; --muted:#97a1b2; --bar:#1e2a3b; --barfg:#e6e9ef;
  --new:#6aa8f2; --learn:#f07070; --rev:#72c47e; --hard:#9aa3b1; --easy:#6aa8f2;
  --zero:#4a5262; --accent:#6aa8f2; --onaccent:#0e1a2b; --heat0:#262c37; --heat:#6aa8f2;
  --young:#4f8a56; --mature:#72c47e; --shadow:0 2px 8px rgba(0,0,0,.5);
  --rv-bg:#10131a; --rv-card:#171b25; --rv-raised:#1d2230; --rv-text:#e7eaf1; --rv-muted:#9aa3b5; --rv-border:#2b3244;
  --rv-accent:#7fa0d8; --rv-accent-ink:#0d1420; --rv-accent-soft:#212b42;
  --ok:#6fd99a; --ok-bg:#123322; --ok-border:#2c6b48; --ko:#f2948d; --ko-bg:#3a1b1c; --ko-border:#7a3934;
  --warn:#e0ab5a; --warn-bg:#3a2c0e; --imp:#c3aeef; --imp-bg:#2a2242;
  --rv-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent}
body.reviewing{background:var(--rv-bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--barfg);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;height:56px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:24px;height:24px;fill:currentColor}
.apptitle{flex:1;min-width:0;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barcounts{display:flex;gap:10px;font-family:var(--f-num);font-size:15px;padding-right:4px}
.barcounts span{padding-bottom:2px;border-bottom:2px solid transparent}
.barcounts .cur{border-bottom-color:currentColor}
.bc-n{color:#9cc8ff}.bc-l{color:#ffb0b0}.bc-r{color:#a7e3ae}
.barsel{background:rgba(255,255,255,.14);color:var(--barfg);border:0;border-radius:6px;font:inherit;font-size:14px;padding:8px 6px;max-width:48vw}
.barsel option{color:var(--fg);background:var(--surface)}
.sec-t{font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.sec-t:first-child{border-top:0;margin-top:0;padding-top:0}
*{box-sizing:border-box}
body{margin:0}
.sync{font-size:11px;opacity:.75;white-space:nowrap}

main{max-width:760px;margin:0 auto;padding-bottom:110px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Lista de mazos */
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:14px 8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.summary b{color:var(--fg);font-weight:500}
.decklist{background:var(--surface);border-block:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:8px;padding-block:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.dhead .sp{flex:1}
.cols{display:grid;grid-template-columns:repeat(3,40px);text-align:right;font-family:var(--f-num)}
.dhead .cols{font-family:var(--f-ui)}
.dhead .cols span:nth-child(1){color:var(--new)}.dhead .cols span:nth-child(2){color:var(--learn)}.dhead .cols span:nth-child(3){color:var(--rev)}
.grp{padding-block:10px 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:500;background:var(--surface2);border-bottom:1px solid var(--line)}
.deck{display:flex;align-items:center;gap:8px;min-height:64px;border-bottom:1px solid var(--line);background:var(--surface)}
.deck:active{background:var(--surface2)}
.deck .main{flex:1;min-width:0;padding-block:10px;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px}
.mark{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--zero)}
.deck.due .mark{background:var(--learn);border-color:var(--learn)}
.deck.done .mark{background:transparent;border-color:var(--rev)}
.dn{min-width:0}
.dn .nm{display:block;font-size:16px;overflow-wrap:anywhere}
.dn .nm .num{font-family:var(--f-num);font-size:13px;color:var(--muted);margin-right:6px}
.deck.due .dn .nm{font-weight:500}
.deck:not(.due) .dn .nm{color:var(--muted)}
.dn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.deck.due .dn small .when{color:var(--learn);font-weight:500}
.tag{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.tag.imp{color:var(--imp);background:var(--imp-bg)}
.tag.weak{color:var(--warn);background:var(--warn-bg)}
.tag.pause{color:var(--muted);background:var(--surface2);border:1px solid var(--line)}
.cols b{font-weight:500;font-size:15px}
.c-n{color:var(--new)}.c-l{color:var(--learn)}.c-r{color:var(--rev)}
.cols b.z{color:var(--zero)}
.more{width:40px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.more svg{width:22px;height:22px;fill:currentColor}
.todo-add{display:flex;gap:8px;padding-block:16px}.todo-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:15px}
.todo-it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.todo-it input{width:20px;height:20px;flex:none;accent-color:var(--accent)}.todo-it span{flex:1;line-height:1.4;word-break:break-word}.todo-it.done span{text-decoration:line-through;color:var(--muted)}.todo-it button{border:0;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px;cursor:pointer}
.empty{padding:48px 24px;text-align:center;color:var(--muted);line-height:1.5}
.legend{padding-block:12px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--zero)}
.legend .lg-due{background:var(--learn);border-color:var(--learn)}
.legend .lg-done{border-color:var(--rev)}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:16px;border:0;background:var(--accent);color:var(--onaccent);box-shadow:0 4px 12px rgba(0,0,0,.3);display:grid;place-items:center;z-index:15}
.fab svg{width:28px;height:28px;fill:currentColor}

/* Vista general del mazo */
.ov{padding-block:28px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.ov h2{margin:0;font-size:22px;font-weight:500;text-wrap:balance}
.ovcounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}
.ovcounts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 6px}
.ovcounts b{display:block;font-family:var(--f-num);font-size:26px;font-weight:500}
.ovcounts span{font-size:12px;color:var(--muted)}
.ovmeta{color:var(--muted);font-size:13.5px;line-height:1.6}
.bigbtn{border:0;border-radius:24px;background:var(--accent);color:var(--onaccent);font-weight:500;letter-spacing:.06em;padding:14px 40px;font-size:15px;text-transform:uppercase}
.bigbtn[disabled]{opacity:.4}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 14px;font-size:13.5px}

/* ---------- Revisor: tarjeta estilo «Repaso Policía Nacional» ---------- */
.rv{font-family:var(--f-rv);color:var(--rv-text);max-width:700px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.rv .mono{font-family:var(--f-rvm)}
.rv-track{height:6px;border-radius:999px;background:var(--rv-border);overflow:hidden}
.rv-fill{height:100%;background:var(--rv-accent);border-radius:999px;transition:width .25s}
.rv-card{background:var(--rv-card);border:1px solid var(--rv-border);border-radius:16px;padding:22px;box-shadow:var(--rv-shadow);display:flex;flex-direction:column;gap:18px}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rv-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-num{font-family:var(--f-rvm);font-size:.85rem;color:var(--rv-muted)}
.chip{font-family:var(--f-rvm);font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px}
.chip.imp{color:var(--imp);background:var(--imp-bg)}
.chip.new{color:var(--rv-accent);background:var(--rv-accent-soft)}
.chip.learn{color:var(--ko);background:var(--ko-bg)}
.chip.rev{color:var(--ok);background:var(--ok-bg)}
.chip.weak{color:var(--warn);background:var(--warn-bg)}
.qtext{font-size:1.18rem;line-height:1.55;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:15px 16px;border-radius:11px;border:1.5px solid var(--rv-border);
  background:var(--rv-raised);color:var(--rv-text);font-family:var(--f-rv);font-size:1.05rem;line-height:1.5;cursor:pointer}
@media (hover:hover) and (pointer:fine){.options:not(.answered):not(.no-hover) .option:hover:not(:disabled){border-color:var(--rv-accent);background:var(--rv-accent-soft)}}
.option{-webkit-tap-highlight-color:transparent}
.option:disabled{cursor:default}
.option .letter{font-family:var(--f-rvm);font-weight:600;font-size:.9rem;width:26px;height:26px;min-width:26px;border-radius:6px;border:1.5px solid var(--rv-border);
  display:flex;align-items:center;justify-content:center;color:var(--rv-muted);margin-top:1px}
.option .label{min-width:0;overflow-wrap:anywhere}
.option.correct{border-color:var(--ok-border);background:var(--ok-bg)}
.option.correct .letter{border-color:var(--ok);background:var(--ok);color:var(--ok-bg)}
.option.correct .label{color:var(--ok);font-weight:600}
.option.incorrect{border-color:var(--ko-border);background:var(--ko-bg)}
.option.incorrect .letter{border-color:var(--ko);background:var(--ko);color:var(--ko-bg)}
.option.incorrect .label{color:var(--ko);font-weight:600}
.option.dim{opacity:.55}
.options.answered .option{cursor:pointer}
.fb-time{font-weight:500;color:var(--rv-muted);font-family:var(--f-rvm);font-size:.82rem}
.rv-left{display:flex;align-items:center;gap:6px}
.navbtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--rv-border);background:var(--rv-raised);color:var(--rv-text);font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.navbtn:disabled{opacity:.35;cursor:default}
.chip.past{color:var(--rv-muted);background:var(--rv-bg);border:1px solid var(--rv-border)}
.refuerzo{border:1px solid var(--rv-border);border-left:4px solid var(--imp);background:var(--imp-bg);border-radius:10px;padding:12px 14px;font-size:.96rem;line-height:1.55;overflow-wrap:anywhere}
.vstat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--rv-muted);min-height:24px}
.vdot{width:12px;height:12px;border-radius:50%;background:var(--rv-border);flex:none}
.vstat.listen .vdot{background:var(--ko);animation:vpulse 1s infinite}
.vstat.listen{color:var(--ko);font-weight:600}
.vstat.speak .vdot{background:var(--rv-accent)}
.vheard{font-family:var(--f-rvm);color:var(--rv-text);font-size:.85rem}
@keyframes vpulse{50%{transform:scale(1.4);opacity:.6}}
.vhelp{font-size:.82rem;color:var(--rv-muted);line-height:1.5}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mchip{border:1px solid var(--rv-border);background:var(--rv-raised);color:var(--rv-muted);border-radius:999px;padding:5px 10px;font:600 .78rem var(--f-rv);cursor:pointer}
.mchip.on{color:var(--rv-accent-ink);background:var(--rv-accent);border-color:var(--rv-accent)}
.mchip.m-star.on{background:var(--warn);border-color:var(--warn);color:#fff}
.mchip.m-erronea.on{background:var(--ko);border-color:var(--ko);color:#fff}
.mchip.m-facil.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mnote2{font-size:.78rem;color:var(--rv-muted);font-style:italic}
.mkbar{width:100%;text-align:left;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font:600 14px var(--f-ui);cursor:pointer}
.mitem{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mq{border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:4px;padding:0;color:var(--fg);font-family:var(--f-card);font-size:15px;line-height:1.4}
.mq small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.mq .ma{display:none;font-family:var(--f-ui);font-size:13.5px;border-left:2px solid var(--rev);padding-left:8px;color:var(--fg)}
.mq .ma em{display:block;font-style:normal;color:var(--muted);margin-top:4px}
.mq .ma b{display:block;font-weight:500;color:var(--warn);margin-top:4px}
.mitem.open .ma{display:block}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.medit{display:inline-flex;align-items:center;gap:4px;color:var(--fg)}
.medit svg{width:14px;height:14px;fill:currentColor}
.tnota{width:120px;text-align:right;font-family:var(--f-num);font-size:15px;padding-right:4px}
.tnota b{font-weight:500}.tnota b.z{color:var(--zero)}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--rv-muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.tgrid button{border:1px solid var(--rv-border);background:var(--rv-raised);color:var(--rv-text);border-radius:6px;padding:7px 0;font:600 .78rem var(--f-rvm);cursor:pointer}
.tgrid .an{background:var(--rv-accent-soft);border-color:var(--rv-accent);color:var(--rv-accent)}
.tgrid .ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tgrid .ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.tgrid .bl{background:var(--rv-bg);color:var(--rv-muted);border-style:dashed}
.tgrid .cur{outline:2px solid var(--rv-text);outline-offset:1px}
.option.picked{border-color:var(--rv-accent);background:var(--rv-accent-soft)}
.option.picked .letter{background:var(--rv-accent);border-color:var(--rv-accent);color:var(--rv-accent-ink)}
.tcomp{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.tcomp b{color:var(--fg);font-family:var(--f-num);font-weight:500}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rv-muted);font-weight:600}
.ref-title{display:block;font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--imp);margin-bottom:4px}
.ref-status{font-size:.82rem;color:var(--imp);margin:0;min-height:1em}
.ref-ov{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--imp);max-width:420px}
.answerbox{border:1.5px dashed var(--rv-border);border-radius:11px;padding:16px;font-size:1.05rem;line-height:1.55;overflow-wrap:anywhere}
.showans{font-family:var(--f-rv);font-weight:600;font-size:1rem;padding:13px 22px;border-radius:10px;border:none;background:var(--rv-accent);color:var(--rv-accent-ink)}
.feedback{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fb-text{font-size:.98rem;font-weight:600}
.fb-text.ok{color:var(--ok)}.fb-text.bad{color:var(--ko)}
.fb-sched{font-size:.82rem;color:var(--rv-muted);font-family:var(--f-rvm)}
.explain{border:1px solid var(--rv-border);border-left:4px solid var(--rv-accent);background:var(--rv-accent-soft);border-radius:10px;padding:12px 14px;font-size:.96rem;line-height:1.55;overflow-wrap:anywhere}
.explain-title{display:block;font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rv-accent);margin-bottom:4px}
.explain-warn{display:block;margin-top:8px;font-size:.86rem;font-weight:600;color:var(--ko)}
.grade{display:flex;flex-direction:column;gap:8px}
.grade-l{font-size:.78rem;color:var(--rv-muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades.four{grid-template-columns:repeat(4,1fr)}
.gbtn{border:1.5px solid var(--rv-border);background:var(--rv-raised);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-rv);font-size:.88rem;font-weight:600;color:var(--rv-text)}
.gbtn small{font-family:var(--f-rvm);font-size:.72rem;font-weight:500;color:var(--rv-muted)}
.gbtn.on{border-color:var(--rv-accent);background:var(--rv-accent-soft);color:var(--rv-accent)}
.gbtn.g1.on{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.rv-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.rv-actions .vbtns{display:flex;gap:8px;align-items:center}
.ghost{font-family:var(--f-rv);font-size:.88rem;font-weight:600;color:var(--rv-muted);background:none;border:none;padding:6px 4px}
.ghost:hover{color:var(--rv-text)}
.next-btn{font-family:var(--f-rv);font-weight:600;font-size:1rem;padding:12px 22px;border-radius:10px;border:none;background:var(--rv-accent);color:var(--rv-accent-ink)}
.next-btn:hover{opacity:.9}
.rv-done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 6px;color:var(--rv-muted)}
.rv-big{font-family:var(--f-rvm);font-size:2.2rem;font-weight:600;color:var(--rv-text)}
.rv-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rv-tile{background:var(--rv-card);border:1px solid var(--rv-border);border-radius:13px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rv-tile .n{font-family:var(--f-rvm);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.rv-tile .l{font-size:.74rem;color:var(--rv-muted)}
.rv-tile .n.ok{color:var(--ok)}.rv-tile .n.bad{color:var(--ko)}
@media (max-width:420px){.rv-card{padding:17px;border-radius:14px}.qtext{font-size:1.08rem}.rv-tile{padding:9px 10px}.rv-tile .n{font-size:1.15rem}}

/* Estadísticas */
.stbar{display:flex;gap:6px;padding-block:12px;overflow-x:auto}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 14px;font-size:13px;white-space:nowrap}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.sec{background:var(--surface);border-block:1px solid var(--line);margin-bottom:12px;padding-block:16px}
.sec h3{margin:0 0 4px;font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.sec .sub{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;font-weight:500;font-family:var(--f-num);margin-top:2px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tblwrap{overflow-x:auto}
table.plan{width:100%;border-collapse:collapse;font-size:13.5px}
.plan th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.plan td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan tr:last-child td{border-bottom:0}
.plan td.num{font-family:var(--f-num);text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.p-today{background:color-mix(in srgb,var(--learn) 16%,transparent);color:var(--learn)}
.p-soon{background:color-mix(in srgb,var(--new) 14%,transparent);color:var(--new)}
.p-later{background:var(--surface2);color:var(--muted)}
.btnrow{display:grid;grid-template-columns:72px 1fr 78px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%}
.btnrow .v{text-align:right;font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.qlist{display:flex;flex-direction:column}
.qitem{border:0;background:transparent;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.qitem:last-child{border-bottom:0}
.qitem .rk{font-family:var(--f-num);color:var(--muted);font-size:13px;padding-top:2px}
.qitem .qt{font-family:var(--f-card);font-size:15px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.qitem .qt small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:3px}
.qitem .qa{display:none;font-family:var(--f-ui);font-size:13px;color:var(--fg);margin-top:6px;padding-left:8px;border-left:2px solid var(--rev)}
.qitem.open .qa{display:block}
.qitem .sc{text-align:right;font-family:var(--f-num);font-size:13px;white-space:nowrap}
.qitem .sc b{display:block;font-size:15px}
.good{color:var(--rev)}.bad{color:var(--learn)}
.qh{font-size:13px;font-weight:500;margin:14px 0 2px}
.qh:first-child{margin-top:0}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:130px;height:130px;flex:none}
.dlist{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 10px;font-size:13.5px;align-items:center;flex:1;min-width:200px}
.dlist i{width:10px;height:10px;border-radius:2px;display:block}
.dlist .n{font-family:var(--f-num);text-align:right}
.dlist .p{font-family:var(--f-num);text-align:right;color:var(--muted);font-size:12.5px}
.heatinfo{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1.2em}
.fc-ctl{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.fc-real.on{background:var(--imp);border-color:var(--imp);color:#fff}
.chart .fcv{fill:var(--fg);font-family:var(--f-num);font-size:9.5px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart .fcv.on,.chart .fcx.on{font-weight:700;fill:var(--fg)}
.fc-avg{display:inline-block;width:14px;border-top:2px dashed var(--fg);opacity:.6;margin-right:5px;vertical-align:3px}
.chart .fchit{cursor:pointer}
.fc-info{margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:13px}
.fc-big{font-size:18px;font-family:var(--f-num);margin-top:2px}
.fc-big em{font-style:normal;font-size:13px;color:var(--muted);font-family:var(--f-ui)}
.fct th:not(:first-child){text-align:right;padding-right:0;padding-left:6px}
.fct td.num{padding-right:0;padding-left:6px}
.fct tbody tr{cursor:pointer}
.fct tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fct tr.tot td{border-top:2px solid var(--line);font-weight:500}

/* Formularios */
.form{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:11px 12px;font:inherit}
.field textarea{min-height:80px;resize:vertical;font-family:var(--f-card);font-size:15px}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=radio]{accent-color:var(--rev);width:18px;height:18px;flex:none}
.optrow input[type=text]{flex:1;min-width:0;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit}
.seg2{display:flex;gap:6px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:0;background:transparent;color:var(--accent);font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-radius:6px;font-size:14px}
.tbtn.danger{color:var(--learn)}
.fbtn{border:0;background:var(--accent);color:var(--onaccent);font-weight:500;letter-spacing:.04em;padding:11px 18px;border-radius:8px;font-size:14px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.switchrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.switchrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* Cajón, hojas, avisos */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);transform:translateX(-105%);transition:transform .22s}
.drawer.open{transform:none}
.drhead{background:var(--bar);color:var(--barfg);padding:28px 20px 18px}
.drhead b{display:block;font-size:18px;font-weight:500}
.drhead span{font-size:13px;opacity:.8}
.dritem{display:flex;align-items:center;gap:22px;border:0;background:transparent;padding:14px 20px;text-align:left;font-size:15px;font-weight:500}
.dritem svg{width:22px;height:22px;fill:var(--muted)}
.dritem.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.dritem.on svg{fill:var(--accent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;background:var(--surface);border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:640px){.sheet{left:50%;right:auto;width:540px;transform:translateX(-50%);bottom:auto;top:8vh;border-radius:14px}}
.sheet h4{margin:12px 0 6px;font-size:18px;font-weight:500}
.sitem{display:flex;align-items:center;gap:18px;width:100%;border:0;background:transparent;padding:14px 4px;text-align:left;font-size:15px}
.sitem svg{width:22px;height:22px;fill:var(--muted);flex:none}
.sitem.danger{color:var(--learn)}.sitem.danger svg{fill:var(--learn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#2b313c;color:#f2f4f7;padding:12px 18px;border-radius:8px;z-index:50;font-size:14px;max-width:calc(100vw - 40px);box-shadow:var(--shadow)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Estudio por páginas */
.estema{background:var(--surface);border-bottom:1px solid var(--line)}
.estema>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px;cursor:pointer;background:var(--surface2);border-bottom:1px solid var(--line)}
.estema>summary::-webkit-details-marker{display:none}
.estema>summary .dn{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.estema>summary .nm{font-size:16px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.estema>summary .num{font-family:var(--f-num);color:var(--accent);font-size:13px}
.estema>summary small{color:var(--muted);font-size:12.5px}
.estema>summary .chev{font-size:22px;color:var(--muted);transition:transform .2s;transform:rotate(90deg)}
.estema:not([open])>summary .chev{transform:rotate(0)}
.estema .deck .main small{line-height:1.45}
.estema .deck .dn .nm{color:var(--fg);font-weight:500}
.estnote{padding-block:10px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.estref{display:block;margin-top:8px;font-size:.84rem;color:var(--rv-muted)}
/* Acceso y usuarios */
#accLogin{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.acc-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.acc-logo{font-size:20px;font-weight:500;color:var(--accent)}.acc-sub{font-size:13px;color:var(--muted);margin-top:-8px}
.acc-card .fbtn{padding:13px;font-size:15px}.acc-err{color:var(--learn);font-size:13.5px;min-height:1.2em;margin:0}
.acc-err.ok{color:var(--accent)}
.acc-t{font-size:17px;font-weight:600}
.acc-txt{font-size:14px;line-height:1.45;margin:0}
.acc-mini{font-size:12.5px;color:var(--muted)}
.acc-aviso{background:var(--bg);border-radius:8px;padding:10px 12px}
.acc-help{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.acc-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.acc-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.acc-tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.acc-priv{text-align:center;font-size:12.5px;text-decoration:none}
.acc-link{border:0;background:none;color:var(--accent);font:inherit;font-size:13.5px;padding:4px;cursor:pointer}
#accLogin{overflow-y:auto}
.accname{display:block;margin-top:6px;font-size:12.5px;opacity:.85}
.utable{overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.utable table{width:100%;border-collapse:collapse;font-size:13.5px}
.utable th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.utable td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.utable tr[data-uopen]{cursor:pointer}.utable td small{display:block;color:var(--muted);font-size:11.5px}
.uwarn{color:var(--learn)!important;font-weight:500}
.udet{display:flex;flex-direction:column;gap:12px;background:var(--surface);margin-top:12px}
.utemas{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.utemas label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}.utemas b{color:var(--accent);min-width:22px}
.ukpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ukpi div{background:var(--surface2);border-radius:8px;padding:10px;text-align:center}.ukpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.ukpi span{font-size:11.5px;color:var(--muted)}
.udias{display:flex;flex-direction:column;gap:6px}
.udia{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;align-items:center;font-size:12.5px}
.ud-d{color:var(--muted)}.ud-bar{height:8px;background:var(--heat0);border-radius:4px;overflow:hidden}.ud-bar i{display:block;height:100%;background:var(--accent)}
.ud-n{grid-column:2;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
</style>
</head>

<main>
  <section id="vDecks">

<button class="fab" id="fab" aria-label="Añadir"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Navegación">
  <div class="drhead"><b>Mazos Oposición</b><span>Policía Nacional · repaso espaciado</span><span id="accName" class="accname"></span></div>
  <button class="dritem" data-go="decks"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H8V4h12z"/></svg>Mazos</button>
  <button class="dritem" id="voiceDr"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>Estudiar por voz</button>

function buildResumen(){const t=dayNum(now()),days={};const ds=deckList();const base={};
  ds.forEach(d=>{const k=counts(d.id);base[d.id]={k,lim:0,left:0}});
  for(let o=0;o<7;o++){const day=t+o,eod=dayTs(day+1),rows=[];
    if(o>0&&isWeekend(day)){days[dayStr(day)]=[];continue}
    ds.forEach(d=>{const b=base[d.id],st=ST[d.id]||{};let n,r;
      if(o===0){n=b.k.n;r=b.k.l+b.k.r}
      else{n=Math.min(b.lim,Math.max(0,b.left-b.lim*(o-1)));r=0;for(const cid of DCARDS[d.id]||[]){const s=st[cid];if(!s)continue;if(s.ty==="review"?s.due<=day:(isLearnT(s.ty)&&s.due<eod))r++}}
      if(n+r>0)rows.push([(d.num!=null?"T"+d.num+" ":"")+d.name,n,r])});
    rows.sort((a,b)=>(b[1]+b[2])-(a[1]+a[2]));days[dayStr(day)]=rows}
  const L=LOG[dayStr(t)]||[];return{generado:now(),hoy:dayStr(t),respondidasHoy:L.length,aciertosHoy:L.filter(x=>x.e>1).length,dias:days}}

/* ---------- planificador (SM-2 al estilo Anki) ---------- */
const LS=[1,10],RLS=[10],AHEAD=20*60e3;
const maxIvl=did=>36500;                              // sin límite de 7 días (el «tema flojo» es solo una etiqueta)
/* ---------- días de estudio: de lunes a viernes, máximo diario global ---------- */
let STVER=0,DUELOAD=null,PLAN=null;
function migCap(){if(CFG.cap250)return;if(CFG.dailyMax===300)delete CFG.dailyMax;CFG.cap250=1}

const CAP_FROM=dayNum(new Date(2026,9,30).getTime());
const dailyMax=(d=dayNum(now()))=>CFG.dailyMax??(d<CAP_FROM?300:250);
const isWeekend=n=>{const g=new Date(dayTs(n)).getDay();return g===0||g===6};
const nextWorkday=n=>{let d=n+1;while(isWeekend(d))d++;return d};
function dueLoad(){if(DUELOAD)return DUELOAD;const m={};for(const did in ST){const st=ST[did];for(const cid in st){const s=st[cid];if(s&&s.ty==="review")m[s.due]=(m[s.due]||0)+1}}return DUELOAD=m}
// Si un repaso cae en sábado o domingo, pasa al viernes o al lunes, el que tenga menos carga.
function studyDay(d,t,L){if(!isWeekend(d))return d;const g=new Date(dayTs(d)).getDay(),fri=d-(g===6?1:2),mon=d+(g===6?2:1);
  if(fri<=t)return mon;const l=L||dueLoad();return(l[fri]||0)<=(l[mon]||0)?fri:mon}
function sched(s0,ease,n,did,L){const s=Object.assign({ty:"new",ivl:0,ease:2.5,step:0,reps:0,lap:0},s0||{}),t=dayNum(n),cap=maxIvl(did),due=iv=>studyDay(t+iv,t,L);
  const grad=ivl=>{s.ty="review";s.ivl=Math.min(ivl,cap);s.due=due(s.ivl);s.step=0};
  const first=s.ty==="new";if(first){s.ty="learn";s.step=0}
  if(first&&ease>=3)grad(ease===4?10:5);   // primera vez: Muy fácil 10 días, Bien 5 días
  else if(s.ty==="learn"){
    if(ease===1){s.step=0;s.due=n+LS[0]*60e3}
    else if(ease===2){s.due=n+(s.step===0?(LS[0]+LS[1])/2:LS[s.step])*60e3}
    else if(ease===3){s.step++;if(s.step>=LS.length)grad(1);else s.due=n+LS[s.step]*60e3}
    else grad(4);
  }else if(s.ty==="review"){
    if(ease===1){s.lap++;s.ease=Math.max(1.3,s.ease-.2);s.ivl=1;s.ty="relearn";s.step=0;s.due=n+RLS[0]*60e3}
    else{let iv;if(ease===2){iv=Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.ease=Math.max(1.3,s.ease-.15)}
      else if(ease===3)iv=Math.max(s.ivl+1,Math.round(s.ivl*s.ease));
      else{iv=Math.max(s.ivl+2,Math.round(s.ivl*s.ease*1.3));s.ease+=.15}
      s.ivl=Math.min(iv,cap);s.due=due(s.ivl)}
  }else{
    if(ease===1){s.step=0;s.due=n+RLS[0]*60e3}
    else if(ease===2){s.due=n+RLS[0]*60e3}
    else if(ease===3){s.ty="review";s.due=due(s.ivl)}
    else{s.ty="review";s.ivl=Math.min(s.ivl+1,cap);s.due=due(s.ivl)}

function ivlText(s,ease,did){const n=now(),x=sched(s,ease,n,did);
  if(isLearnT(x.ty)){const m=Math.round((x.due-n)/60e3);return m<60?m+" min":Math.round(m/60)+" h"}
  const d=x.due-dayNum(n);if(d===1)return"1 día";if(d<30)return d+" días";if(d<365)return dec(d/30)+" meses";return dec(d/365)+" años"}

// Plan del día: cada pregunta cuenta una vez (los fallos que se repiten no suman).
function plan(){const n=now(),t=dayNum(n);if(PLAN&&PLAN.day===t&&PLAN.ver===STVER)return PLAN;
  const cap=dailyMax(),wk=isWeekend(t),eot=dayTs(t+1),done=new Set((LOG[dayStr(t)]||[]).map(r=>r.c));
  const P={day:t,ver:STVER,ids:new Set(),cap,weekend:wk,used:0,backlog:0,newToday:0};
  const dueL=[],news={},intro={};let introN=0;
  for(const d of Object.values(DECKS)){const st=ST[d.id]||{},paused=!!dcfg(d.id).paused,nl=[];
    for(const cid of DCARDS[d.id]||[]){const s=st[cid],ty=typeOf(s);
      if(done.has(cid)){P.used++;if(s&&s.intro===t){introN++;intro[d.id]=(intro[d.id]||0)+1}if(isLearnT(ty))P.ids.add(cid);continue}
      if(ty==="new"){if(!paused)nl.push(cid)}
      else if(isLearnT(ty)){if(s.due<eot)dueL.push([dayNum(s.due),s.due,cid])}
      else if(s.due<=t)dueL.push([s.due,0,cid])}
    if(nl.length)news[d.id]=nl.sort((a,b)=>CARDS[a].ord-CARDS[b].ord)}
  dueL.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  let room=wk?0:Math.max(0,cap-P.used),rev=0;
  for(const x of dueL){if(room<=0)break;P.ids.add(x[2]);room--;rev++}
  P.backlog=dueL.length-rev;
  // nuevas: el cupo del día (incluidas las ya introducidas hoy) se reparte por turnos entre los temas
  const order=deckList().map(d=>d.id).filter(id=>news[id]||intro[id]);
  if(room>0&&order.length){const k=t%order.length,rot=order.slice(k).concat(order.slice(0,k)),alloc={},capD=id=>(intro[id]||0)+(news[id]||[]).length;
    let budget=room+introN,any=true;
    while(budget>0&&any){any=false;for(const id of rot){if(budget<=0)break;if((alloc[id]||0)<capD(id)){alloc[id]=(alloc[id]||0)+1;budget--;any=true}}}
    const take={};let left=room;
    for(const id of rot){const q=Math.min(left,Math.max(0,(alloc[id]||0)-(intro[id]||0)),(news[id]||[]).length);take[id]=q;left-=q}
    any=true;while(left>0&&any){any=false;for(const id of rot){if(left<=0)break;if(take[id]<(news[id]||[]).length){take[id]++;left--;any=true}}}
    for(const id of rot)for(let i=0;i<take[id];i++){P.ids.add(news[id][i]);P.newToday++}}
  return PLAN=P}
/* ---------- sesión mixta: N preguntas del plan de hoy, de todos los temas ---------- */
let MIX=null;
function mixPending(cid,P){const c=CARDS[cid];if(!c)return false;const s=(ST[c.did]||{})[cid],ty=typeOf(s);
  if(ty==="new")return true;if(isLearnT(ty))return s.due<dayTs(P.day+1);return s.due<=P.day}
function buildMix(n){const P=plan(),rv=[],nw={};
  for(const cid of P.ids){if(!mixPending(cid,P))continue;const c=CARDS[cid],s=(ST[c.did]||{})[cid],ty=typeOf(s);
    if(ty==="new")(nw[c.did]=nw[c.did]||[]).push(cid);else rv.push([isLearnT(ty)?dayNum(s.due):s.due,isLearnT(ty)?s.due:0,cid])}
  rv.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const ids=rv.map(x=>x[2]);
  const rot=deckList().map(d=>d.id).filter(id=>nw[id]);rot.forEach(id=>nw[id].sort((a,b)=>CARDS[a].ord-CARDS[b].ord));
  for(let i=0,any=true;any;i++){any=false;for(const id of rot)if(nw[id][i]){ids.push(nw[id][i]);any=true}}
  return ids.slice(0,n)}
function startMix(n,voz){const ids=buildMix(n);if(!ids.length){toast(PLAN&&PLAN.weekend?"Fin de semana: hoy no toca estudiar":"No quedan preguntas pendientes hoy");return}
  MIX={n,ids};if(ids.length<n)toast("Solo quedan "+ids.length+" preguntas pendientes hoy; van todas");if(voz)voiceStart("_mix");else go("review",{deck:"_mix"})}
function mixCounts(){const P=plan();let nw=0,ln=0,rv=0;for(const cid of MIX?MIX.ids:[]){if(!mixPending(cid,P))continue;const c=CARDS[cid],ty=typeOf((ST[c.did]||{})[cid]);
  if(ty==="new")nw++;else if(isLearnT(ty))ln++;else rv++}return{n:nw,l:ln,r:rv,total:MIX?MIX.ids.length:0,newLeft:0}}
function nextMixed(avoid){const n=now(),t=dayNum(n),learnNow=[],rev=[],news=[],ahead=[],sOf=cid=>(ST[CARDS[cid].did]||{})[cid];
  for(const cid of MIX?MIX.ids:[]){if(!CARDS[cid])continue;const s=sOf(cid),ty=typeOf(s);
    if(ty==="new")news.push(cid);else if(isLearnT(ty)){if(s.due<=n)learnNow.push(cid);else if(s.due<=n+AHEAD)ahead.push(cid)}else if(s.due<=t)rev.push(cid)}
  const byDue=(a,b)=>sOf(a).due-sOf(b).due;learnNow.sort(byDue);ahead.sort(byDue);rev.sort((a,b)=>sOf(a).due-sOf(b).due||Math.random()-.5);

function parseDelim(text){text=text.replace(/^﻿/,"");const fl=text.split(/\r?\n/)[0]||"";
  const dl=fl.includes("\t")?"\t":(fl.split(";").length>fl.split(",").length?";":",");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows}

/* ---------- refuerzos de Claude para preguntas falladas 3 o más veces ---------- */
let refBusy=null,refOff=false;
const hasAI=()=>!!(SYNC.key&&SYNC.key.trim());
async function callClaude(prompt,tools){const messages=[{role:"user",content:prompt}];
  for(let round=0;round<10;round++){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":SYNC.key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:SYNC.model||"claude-sonnet-5-5",max_tokens:4000,tools:tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema})),messages})});
    if(!r.ok){const e=new Error("api");e.status=r.status;throw e}
    const j=await r.json();messages.push({role:"assistant",content:j.content});
    if(j.stop_reason==="tool_use"){messages.push({role:"user",content:j.content.filter(b=>b.type==="tool_use").map(b=>{const t=tools.find(x=>x.name===b.name);let out;
      try{out=t?t.execute(b.input||{}):{error:"herramienta desconocida"}}catch(err){out={error:String(err)}}return{type:"tool_result",tool_use_id:b.id,content:JSON.stringify(out)}})});continue}
    return j.content.filter(b=>b.type==="text").map(b=>b.text).join("")}
  throw new Error("rondas")}
function parseJsonLoose(t){const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);const s=m?m[1]:t.slice(t.indexOf("["),t.lastIndexOf("]")+1);return JSON.parse(s)}

function failMap(did){const f={};for(const k in LOG)for(const r of LOG[k])if(r.d===did&&r.e===1)f[r.c]=(f[r.c]||0)+1;return f}
const failCount=cid=>{let n=0;for(const k in LOG)for(const r of LOG[k])if(r.c===cid&&r.e===1)n++;return n};
function refPending(did){const f=failMap(did),items=REF[did]?.items||{};return Object.keys(f).filter(cid=>f[cid]>2&&CARDS[cid]&&!items[cid])}
const refReady=did=>Object.keys(REF[did]?.items||{}).filter(id=>CARDS[id]).length;
function refStatusText(did){if(refBusy===did)return"Claude está preparando refuerzos para las preguntas que más fallas…";
  const p=refPending(did).length;if(!p)return refReady(did)?refReady(did)+" preguntas con refuerzo de Claude en este tema.":"";
  if(!hasAI()||refOff)return p+" preguntas falladas 3 o más veces esperan refuerzo (añade tu clave de Claude en Ajustes para generarlos).";
  return p+" preguntas falladas 3 o más veces esperan refuerzo de Claude."}

const normTxt=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const STOPW=new Set("de la el en y a los las del que se por un una con para al es lo su o como mas sus le ya este esta son ha cual segun sera seran ser sin entre sobre todo toda cuando dicho dicha caso podra puede deberan respuesta correcta senale siguiente siguientes".split(" "));
const toks=s=>(normTxt(s).match(/[a-z0-9ñ]+/g)||[]).filter(w=>(w.length>2||/\d/.test(w))&&!STOPW.has(w));
let SIDX=null,SDF=null;
function buildSearch(){SIDX=[];SDF={};for(const c of Object.values(CARDS)){const t=new Set(toks(c.q+" "+(c.kind==="test"?c.opts[c.a]:c.ans)+" "+(c.exp||"")));SIDX.push({c,t});t.forEach(w=>SDF[w]=(SDF[w]||0)+1)}}
function searchBank(q,exclude,n){if(!SIDX)buildSearch();const qt=[...new Set(toks(q))],N=SIDX.length,ex=new Set(exclude||[]);
  return SIDX.map(x=>{let s=0;for(const w of qt)if(x.t.has(w))s+=Math.log(N/(SDF[w]||1))*(/\d/.test(w)?1.5:1);return[s,x.c]}).filter(([s,c])=>s>0&&!ex.has(c.id))
    .sort((a,b)=>b[0]-a[0]).slice(0,n||6).map(([,c])=>({tema:DECKS[c.did].num??DECKS[c.did].name,pregunta:c.q,respuesta_correcta:c.kind==="test"?c.opts[c.a]:c.ans,explicacion:(c.exp||"").slice(0,320)}))}
async function maybeRefuerzo(did){if(!hasAI()||refOff||refBusy||!refPending(did).length)return;await runRefuerzo(did)}
async function runRefuerzo(did){const ids=refPending(did).slice(0,6);if(!ids.length||refBusy)return;refBusy=did;refreshRefUI();
  const items=ids.map(cid=>{const c=CARDS[cid],picks={};for(const k in LOG)for(const r of LOG[k])if(r.c===cid&&r.e===1&&r.o!=null&&c.kind==="test")picks[r.o]=(picks[r.o]||0)+1;
    return{id:cid,tema:DECKS[c.did].num,pregunta:c.q,opciones:c.kind==="test"?c.opts:undefined,respuesta_correcta:c.kind==="test"?c.opts[c.a]:c.ans,explicacion:c.exp||"",
      veces_fallada:failCount(cid),opciones_incorrectas_que_eligio:c.kind==="test"?Object.entries(picks).map(([o,n])=>c.opts[o]+" ("+n+" veces)"):undefined}});
  const prompt="Eres preparador de oposiciones a la Escala Básica de la Policía Nacional (España). El alumno ha fallado cada una de estas preguntas tipo test 3 o más veces. "+
    "Para cada pregunta escribe un refuerzo breve que le ayude a no volver a fallarla. Elige el recurso que mejor sirva para esa pregunta concreta:\n"+
    "- Nemotecnia: una regla, acrónimo o frase fácil de recordar.\n- Relación con el temario: conecta el dato con otra parte del temario que el alumno ya estudia (usa la herramienta buscar_temario para encontrar preguntas relacionadas y di de qué tema son).\n"+
    "- Esquema: una comparación corta de lo que confunde (por ejemplo, plazos o mayorías parecidos).\n- Trampa de examen: por qué la opción incorrecta que suele elegir parece correcta y cómo distinguirla.\n\n"+
    "Reglas: usa buscar_temario al menos una vez por pregunta antes de escribir. No inventes artículos, cifras ni plazos; apóyate solo en la explicación dada y en lo que devuelva la herramienta. "+
    "Máximo 90 palabras por refuerzo, en español, texto plano (puedes usar saltos de línea y guiones, sin Markdown). "+
    "Responde solo con un array JSON con un objeto por pregunta: [{\"id\":\"…\",\"tipo\":\"Nemotecnia|Relación con el temario|Esquema|Trampa de examen\",\"texto\":\"…\"}].\n\nPreguntas:\n"+JSON.stringify(items,null,1);
  try{const text=await callClaude(prompt,[{name:"buscar_temario",
      description:"Busca en el banco de preguntas del temario de Policía Nacional (todos los temas) por palabras clave. Devuelve hasta 6 preguntas relacionadas con su tema, respuesta correcta y explicación.",
      inputSchema:{type:"object",properties:{consulta:{type:"string",description:"Palabras clave, por ejemplo: prescripción infracciones extranjería"}},required:["consulta"]},
      execute:({consulta})=>searchBank(consulta,ids,6)}]);const out=parseJsonLoose(text);
    const arr=Array.isArray(out)?out:(out&&Array.isArray(out.refuerzos)?out.refuerzos:[]);let n=0;
    const box=REF[did]||(REF[did]={items:{}});box.items=box.items||{};
    arr.forEach(x=>{if(!x||!ids.includes(x.id)||!x.texto)return;box.items[x.id]={text:String(x.texto).slice(0,1500),kind:String(x.tipo||"Repaso").slice(0,40),ts:now(),fails:failCount(x.id)};n++});
    if(n){saveRef(did);toast("Claude ha preparado "+n+" refuerzo"+(n>1?"s":"")+(DECKS[did].num!=null?" del Tema "+DECKS[did].num:""))}else toast("Claude no devolvió refuerzos; se intentará en la próxima sesión");
  }catch(e){const st=e&&e.status;if(st===401||st===403){refOff=true;toast("La clave de Claude no es válida; revísala en Ajustes")}else if(st===429||st===529||st===503){toast("Claude está ocupado; los refuerzos se prepararán en la próxima sesión")}else toast("No se pudieron preparar los refuerzos; se intentará en la próxima sesión")}
  finally{refBusy=null;refreshRefUI()}}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const voiceOK=()=>!!(SR&&window.speechSynthesis);
let V=null;   // estado del modo voz
const NUMW={uno:1,una:1,primero:1,primera:1,dos:2,segundo:2,segunda:2,tres:3,tercero:3,tercera:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,
  veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40};
function wordsToNum(s){const t=normTxt(s).replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean);
  for(let i=0;i<t.length;i++){if(/^\d+$/.test(t[i]))return+t[i];
    if(NUMW[t[i]]!=null){let n=NUMW[t[i]];if((n===30||n===40)&&t[i+1]==="y"&&NUMW[t[i+2]]!=null&&NUMW[t[i+2]]<10)n+=NUMW[t[i+2]];return n}}return null}
const OPTW=[["a","uno","una","1","primera","primero","alfa","alpha","alpa"],["b","be","ve","uve","dos","2","segunda","segundo","bravo"],["c","ce","se","sé","tres","3","tercera","tercero","ultima","charlie","charly","charli","chali"]];
function parseOption(s){const n=normTxt(s).replace(/[^a-z0-9ñ ]/g," ").trim(),t=n.split(/\s+/).filter(Boolean);if(!t.length)return null;
  const hits=new Set();t.forEach(w=>OPTW.forEach((l,i)=>{if(l.includes(w))hits.add(i)}));
  if(hits.size===1){const i=[...hits][0];if(i===0&&t.length>4&&!t.some(w=>w!=="a"&&OPTW[0].includes(w)))return null;return i}
  if(hits.size>1){for(let k=t.length-1;k>=0;k--){for(let i=0;i<3;i++)if(OPTW[i].includes(t[k])&&t[k]!=="a"&&t[k]!=="se")return i}}return null}
const FILLER=new Set(["la","el","lo","es","opcion","respuesta","letra","numero","creo","que","pues","vale","eh","em","mmm","la","seria","digo","por","favor","yo","de","una","un"]);
function parseAnswer(s){const t=normTxt(s).replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean);if(!t.length||t.length>5)return null;
  const hits=new Set();for(const w of t){let idx=-1;for(let i=0;i<3;i++)if(OPTW[i].includes(w)){idx=i;break}
    if(idx>=0){if(!(w==="una"&&t.length>1))hits.add(idx);continue}if(!FILLER.has(w))return null}
  return hits.size===1?[...hits][0]:null}
function parseCmd(s){const n=normTxt(s);
  if(/\b(para|pausa|detente|stop|espera)\b/.test(n))return"pause";if(/\b(salir|sal|terminar|termina|acabar)\b/.test(n))return"exit";
  if(/\b(cambia|cambiar|otro tema|cambio de tema)\b/.test(n))return"change";if(/\b(repite|repetir|otra vez|no te he oido|que)\b/.test(n))return"repeat";
  if(/\b(salta|saltar|pasa|siguiente)\b/.test(n))return"skip";if(/\b(explicacion|por que)\b/.test(n))return"explain";return null}
function speakText(s){return String(s||"").replace(/\bart(s)?\.\s*/gi,"artículo$1 ").replace(/\bLO\b/g,"ley orgánica").replace(/\bRD\b/g,"real decreto").replace(/\bCE\b/g,"Constitución")
  .replace(/\bCP\b/g,"Código Penal").replace(/\bLECrim\b/gi,"Ley de Enjuiciamiento Criminal").replace(/\bSG\b/g,"subdirección general").replace(/\bDG\b/g,"dirección general")

  try{const[r1,r2,r3]=await Promise.all([cueFetch("/perfiles"),cueFetch("/actividad"),cueFetch("/bloqueados")]);if(!r1.ok)throw new Error(await fbErr(r1));perf=await r1.json()||{};if(r2.ok)act=await r2.json()||{};if(r3.ok)bloq=await r3.json()||{}}catch(e){ok=false}
  for(const u in perf)perf[u].activo=bloq[u]!==true;
  UV.perf=perf;UV.act=act;if(view!=="users")return;
  const users=Object.entries(perf).filter(([u])=>u!==ACC.u).sort((a,b)=>((b[1].ultimo||0)-(a[1].ultimo||0)));
  let h='<div class="pad"><p class="note">'+(ok?"Cada persona se crea su cuenta con su correo desde la pantalla de entrada (sirve la misma de Duelo de Preguntas). Al confirmar el correo tiene acceso a todos los temas. "+users.length+(users.length===1?" cuenta.":" cuentas."):"Sin conexión con Firebase: no se pueden cargar las cuentas ahora.")+'</p></div>';
  if(users.length){h+='<div class="utable"><table><thead><tr><th>Usuario</th><th>Último acceso</th><th>Hoy</th><th>7 días</th><th>Racha</th><th>Disp.</th></tr></thead><tbody>';
    users.forEach(([u,x])=>{const s=accStats(act[u]);h+='<tr data-uopen="'+esc(u)+'"><td><b>'+esc(x.nombre||"Sin nombre")+'</b><small>'+esc(x.correo||"")+(x.activo===false?" · desactivada":"")+'</small></td><td>'+esc(agoTxt(s.ultimo||x.ultimo))+'</td><td>'+s.hoy.n+'</td><td>'+s.s7.n+'</td><td>'+s.racha+'</td><td'+(s.devs.length>2?' class="uwarn"':'')+'>'+s.devs.length+'</td></tr>'});
    h+='</tbody></table></div>'}
  h+='<div id="uDetail"></div>';box.innerHTML=h;
  box.querySelectorAll("[data-uopen]").forEach(tr=>tr.onclick=()=>{UV.open=tr.dataset.uopen;renderUserDetail();$("#uDetail").scrollIntoView({behavior:"smooth"})});
  if(UV.open&&perf[UV.open])renderUserDetail()}
function renderUserDetail(){const u=UV.open,x=UV.perf[u];if(!x)return;const s=accStats(UV.act[u]),t=dayNum(now()),temasAll=deckList().filter(d=>d.num!=null).map(d=>({n:d.num,name:d.name}));
  let h='<div class="pad udet"><div class="sec-t">'+esc(x.nombre||"Sin nombre")+' · '+esc(x.correo||"")+'</div><p class="note">Alta: '+(x.alta?esc(relDay(dayNum(x.alta))):"—")+'</p>';
  h+='<label class="switchrow"><span>Cuenta activa<small>Si la desactivas, no podrá entrar en Mazos (se aplica al volver a abrir la app).</small></span><input type="checkbox" id="uAct"'+(x.activo===false?"":" checked")+'></label>';
  h+='<div class="rowbtns"><button class="fbtn" id="uSave">Guardar</button></div><p class="note" id="uMsg"></p>';
  h+='<div class="sec-t">Actividad</div><div class="ukpi"><div><b>'+s.hoy.n+'</b><span>hoy</span></div><div><b>'+s.s7.n+'</b><span>7 días</span></div><div><b>'+s.s30.n+'</b><span>30 días</span></div><div><b>'+pct(s.s30.ok,s.s30.n)+'%</b><span>acierto 30 d</span></div><div><b>'+s.racha+'</b><span>racha</span></div><div><b>'+s.s7.min+'</b><span>min 7 días</span></div></div>';
  const maxN=Math.max(1,...Array.from({length:7},(_,i)=>(s.per[dayStr(t-i)]||{}).n||0));
  h+='<div class="udias">'+Array.from({length:7},(_,i)=>{const ds=dayStr(t-i),r=s.per[ds]||{n:0,ok:0,min:0,ent:0};return'<div class="udia"><span class="ud-d">'+cap(relDay(t-i))+'</span><span class="ud-bar"><i style="width:'+Math.round(100*r.n/maxN)+'%"></i></span><span class="ud-n">'+r.n+(r.n?' · '+pct(r.ok,r.n)+'% · '+r.min+' min':'')+(r.ent?' · '+r.ent+(r.ent===1?' entrada':' entradas'):'')+'</span></div>'}).join("")+'</div>';
  const tr=Object.entries(s.temas).sort((a,b)=>b[1][0]-a[1][0]);
  h+='<div class="sec-t">Temas (últimos 30 días)</div>'+(tr.length?'<div class="utable"><table><thead><tr><th>Tema</th><th>Respondidas</th><th>Acierto</th></tr></thead><tbody>'+tr.map(([k,v])=>{const T=temasAll.find(z=>String(z.n)===String(k));return'<tr><td>'+esc(T?T.n+". "+T.name:k)+'</td><td>'+v[0]+'</td><td'+(pct(v[1],v[0])<60?' class="uwarn"':'')+'>'+pct(v[1],v[0])+'%</td></tr>'}).join("")+'</tbody></table></div>':'<p class="note">Todavía no ha respondido preguntas.</p>');
  h+='<div class="sec-t">Dispositivos</div>'+(s.devs.length?s.devs.map(d=>'<p class="note">'+esc(d.tipo||"?")+' · '+esc(agoTxt(d.ultimo))+'</p>').join(""):'<p class="note">Aún no ha estudiado.</p>')+(s.devs.length>2?'<p class="note uwarn">Más de 2 dispositivos: puede que esté compartiendo la cuenta.</p>':'');
  h+='</div>';$("#uDetail").innerHTML=h;
  $("#uSave").onclick=async()=>{const activo=$("#uAct").checked;$("#uMsg").textContent="Guardando…";
    try{const r=await cueFetch("/bloqueados/"+u,activo?{method:"DELETE"}:{method:"PUT",body:"true"});if(!r.ok)throw new Error(await fbErr(r));
      x.activo=activo;toast("Guardado");renderUsers()}catch(e){$("#uMsg").textContent="No se pudo guardar ("+e.message+")."}}}

// Ajustes: los amigos no ven la sincronización con tu Firebase ni los avisos
{const rsOrig=renderSettings;renderSettings=function(){rsOrig();if(!accFriend())return;let skip=false;
  [...$("#settingsBody").children].forEach(el=>{if(el.classList.contains("sec-t"))skip=/sincroniz|avisos/i.test(el.textContent);if(skip)el.hidden=true})}}

/* ---------- banco de preguntas (en Firebase, solo para cuentas confirmadas) ---------- */
// Las preguntas ya no van en el código de la página: se descargan al entrar y se guardan en el dispositivo
// para poder estudiar sin conexión. Solo se vuelven a descargar cuando Diego sube un banco nuevo.
const BANCO_DB=DEFAULT_FB+"/oposinator/banco";
async function bancoFetch(path,opts){const t=await authToken();const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);
  try{return await fetch(BANCO_DB+path+".json?auth="+encodeURIComponent(t),Object.assign({signal:ctl.signal},opts||{}))}finally{clearTimeout(tm)}}
function bancoAplicar(d){if(Array.isArray(d))d={q:d,e:[]};if(!d||!Array.isArray(d.q)||!d.q.length)return false;BANK=d.q;ESTUDIO=Array.isArray(d.e)?d.e:[];return true}
async function cargarBanco(){if(!idb)idb=await idbOpen();let cache=null;try{cache=await idbGet("banco")}catch(e){}
  if(navigator.onLine){try{const rv=await bancoFetch("/version");
      if(rv.ok){const v=await rv.json();
        if(v&&(!cache||cache.v!==v)){const rp=await bancoFetch("/preguntas");if(rp.ok){const j=await rp.json();if(typeof j==="string"&&bancoAplicar(JSON.parse(j))){await idbSet("banco",{v,json:j});return true}}}}}
    catch(e){}}
  if(cache&&cache.json){try{return bancoAplicar(JSON.parse(cache.json))}catch(e){}}return false}
async function subirBanco(file){const txt=await file.text();let d;try{d=JSON.parse(txt)}catch(e){throw new Error("el archivo no es un JSON válido")}
  if(Array.isArray(d))d={q:d,e:[]};if(!d||!Array.isArray(d.q)||!d.q.length||!d.q[0].q||!Array.isArray(d.q[0].opts))throw new Error("el archivo no tiene el formato del banco");
  const j=JSON.stringify({formato:"banco-mazos-1",q:d.q,e:d.e||[]});
  let r=await bancoFetch("/preguntas",{method:"PUT",body:JSON.stringify(j)});if(!r.ok)throw new Error(await fbErr(r));
  const v=now();r=await bancoFetch("/version",{method:"PUT",body:JSON.stringify(v)});if(!r.ok)throw new Error(await fbErr(r));
  await idbSet("banco",{v,json:j});return d.q.length}
// Si no hay preguntas (primera vez sin conexión, o banco aún no subido) se muestra esta pantalla.
function bancoGate(){return new Promise(res=>{const d=document.createElement("div");d.id="accLogin";
  const pinta=msg=>{d.innerHTML='<div class="acc-card"><div class="acc-logo">Mazos Oposición</div><div class="acc-t">Faltan las preguntas</div>'+
    (ACC.admin?'<p class="acc-txt">Todavía no hay banco de preguntas en Firebase. Elige el archivo <b>banco-oposinator.json</b> para subirlo.</p><input type="file" id="bgFile" accept=".json,application/json"><button class="fbtn" id="bgUp">Subir banco</button>'
      :'<p class="acc-txt">Necesitas conexión a internet la primera vez para descargar las preguntas. Si ya tienes conexión, puede que las preguntas aún no estén disponibles: inténtalo en un rato.</p>')+
    '<button class="tbtn" id="bgRetry">Reintentar</button><button class="acc-link" id="bgOut">Cerrar sesión</button><p class="acc-err" role="alert">'+esc(msg||"")+'</p></div>';
    $("#bgRetry").onclick=async()=>{pinta("Cargando…");if(await cargarBanco()){d.remove();res()}else pinta("Sigue sin poder descargarse.")};
    $("#bgOut").onclick=()=>{CUE=null;cueSave();location.reload()};
    if($("#bgUp"))$("#bgUp").onclick=async()=>{const f=$("#bgFile").files[0];if(!f)return pinta("Elige antes el archivo.");pinta("Subiendo… puede tardar un minuto.");
      try{const n=await subirBanco(f);bancoAplicar(JSON.parse((await idbGet("banco")).json));toast(n+" preguntas subidas");d.remove();res()}catch(e){pinta("No se pudo subir: "+e.message)}}};
  document.body.appendChild(d);pinta()})}

/* ---------- borrar la cuenta ---------- */
function accBorrarCuenta(){const s=sheet('<h4>Borrar mi cuenta</h4><p class="note">Se borran tu cuenta, tu perfil y tu actividad. <b>Es la misma cuenta que en Duelo de Preguntas</b>, así que también dejarás de poder entrar allí. No se puede deshacer.</p>'+
    '<div class="field"><label for="dcPw">Escribe tu contraseña para confirmar</label><input id="dcPw" type="password" autocomplete="current-password"></div><p class="note" id="dcMsg"></p>'+
    '<div class="rowbtns"><button class="tbtn" data-x>Cancelar</button><button class="fbtn danger" data-ok>Borrar mi cuenta</button></div>');
  s.querySelector("[data-x]").onclick=closeSheet;
  s.querySelector("[data-ok]").onclick=async e=>{const pw=$("#dcPw").value;if(!pw){$("#dcMsg").textContent="Escribe tu contraseña.";return}e.target.disabled=true;$("#dcMsg").textContent="Borrando…";
    try{const c=await authApi("signInWithPassword",{email:CUE.email,password:pw,returnSecureToken:true});TOK={t:c.idToken,exp:now()+3000e3};
      await cueFetch("/actividad/"+CUE.uid,{method:"DELETE"}).catch(()=>{});await cueFetch("/perfiles/"+CUE.uid,{method:"DELETE"}).catch(()=>{});
      await authApi("delete",{idToken:c.idToken});
      try{if(!idb)idb=await idbOpen();const tx=idb.transaction("kv","readwrite");tx.objectStore("kv").delete("state:"+CUE.uid);localStorage.removeItem(LKEY+"."+CUE.uid);localStorage.removeItem("todo."+CUE.uid)}catch(er){}
      CUE=null;cueSave();closeSheet();alert("Tu cuenta se ha borrado.");location.reload()}
    catch(er){e.target.disabled=false;$("#dcMsg").textContent=authErrTxt(er.code||er.message)}}}

// Ajustes: cuenta (todos) y banco de preguntas (solo Diego)
{const rsCuenta=renderSettings;renderSettings=function(){rsCuenta();const b=$("#settingsBody");if(!b||!ACC)return;
  let h='<div class="sec-t">Tu cuenta</div><p class="note">'+esc(ACC.nombre)+' · '+esc(ACC.email)+'. Es la misma cuenta que en Duelo de Preguntas.</p>'+
    '<p class="note"><a href="/privacidad" target="_blank" rel="noopener">Política de privacidad</a></p>'+
    (ACC.admin?'':'<div class="rowbtns"><button class="tbtn danger" id="delAcc">Borrar mi cuenta</button></div>');
  if(ACC.admin)h+='<div class="sec-t">Banco de preguntas</div><p class="note">'+BANK.length+' preguntas en Firebase. Para cambiarlo, sube un archivo banco-oposinator.json: llegará a todos la próxima vez que abran la app.</p>'+
    '<div class="field"><input type="file" id="bkFile" accept=".json,application/json"></div><div class="rowbtns"><button class="fbtn" id="bkUp">Subir banco</button></div><p class="note" id="bkMsg"></p>';
  b.insertAdjacentHTML("beforeend",h);
  if($("#delAcc"))$("#delAcc").onclick=accBorrarCuenta;
  if($("#bkUp"))$("#bkUp").onclick=()=>{const f=$("#bkFile").files[0];if(!f){$("#bkMsg").textContent="Elige antes el archivo.";return}
    confirmBox("¿Sustituir el banco de preguntas de todos los usuarios por este archivo?","Subir",async()=>{$("#bkMsg").textContent="Subiendo… puede tardar un minuto.";
      try{const n=await subirBanco(f);$("#bkMsg").textContent="Listo: "+n+" preguntas. Recarga la app para verlas."}catch(e){$("#bkMsg").textContent="No se pudo subir: "+e.message}})}}}

/* ---------- arranque ---------- */
async function start(){
  await accGate();
  if(!(await cargarBanco()))await bancoGate();
  if(accFriend()){BANK=BANK.filter(q=>temaOk(q.tema));ESTUDIO=ESTUDIO.filter(T=>temaOk(T.tema));accEntrada()}
  $("#accName").textContent=ACC.nombre+(ACC.admin?" · administrador":"");$("#usersDr").hidden=!ACC.admin;$("#logoutDr").onclick=()=>{closeDrawer();accLogout()};
  const had=await loadLocal();
  if(!had&&accFriend()){applyState({});await saveLocalNow()}
  else if(!had){try{const seed=JSON.parse(document.getElementById("seed").textContent);applyState(seed);allPaths().forEach(p=>{DOCTS[p]=DOCTS[p]||1})}catch(e){WEAK0.forEach(n=>{dcfg("t"+n).weak=true})}await saveLocalNow()}
  buildIndex();go("decks");
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(SYNC.url&&!accFriend()){if(await pullRemote())go(view);touch("resumen/main")}
  if(accFriend())setTimeout(accReport,3000)}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
$("#fsBtn").onclick=()=>{closeDrawer();const d=document;if(d.fullscreenElement)d.exitFullscreen&&d.exitFullscreen();else d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen().catch(()=>toast("Instala la app para verla a pantalla completa"))};
start();
})();
</script>
<script>
// Mudanza a www.oposinator.com: solo en la dirección antigua (github.io) y solo cuando la web nueva ya responde.
(function(){
  if(!/github\.io$/.test(location.hostname))return;
  var NUEVO="https://www.oposinator.com";
  var FB="https://curva-olvido-f89d1-default-rtdb.europe-west1.firebasedatabase.app/mazosOposicion/traslados/";
  var HECHO="mazosOposicion.mudado";
  try{if(sessionStorage.getItem("mudanzaLuego"))return}catch(e){}
  fetch(NUEVO+"/traslado.html",{mode:"no-cors",cache:"no-store"}).then(mostrar).catch(function(){});
  function mostrar(){
    var ya=false;try{ya=!!localStorage.getItem(HECHO)}catch(e){}
    var d=document.createElement("div");
    d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#1d5fae;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif;max-width:520px;margin:0 auto";
    d.innerHTML=ya
      ?'<b>Ya te has mudado.</b> Usa la app en <b>www.oposinator.com</b> e instálala desde allí.<div style="display:flex;gap:8px;margin-top:10px"><a href="'+NUEVO+'" style="flex:1;text-align:center;background:#fff;color:#1d5fae;border-radius:10px;padding:10px;font-weight:700;text-decoration:none">Abrir la nueva</a><button id="mzLuego" style="flex:none;background:transparent;color:#fff;border:1px solid #fff8;border-radius:10px;padding:10px 14px">Cerrar</button></div>'
      :'<b>Mazos se muda a www.oposinator.com.</b> Pulsa «Mudarme» para llevarte tu progreso. Tarda unos segundos.<div style="display:flex;gap:8px;margin-top:10px"><button id="mzMudar" style="flex:1;background:#fff;color:#1d5fae;border:0;border-radius:10px;padding:10px;font-weight:700">Mudarme</button><button id="mzLuego" style="flex:none;background:transparent;color:#fff;border:1px solid #fff8;border-radius:10px;padding:10px 14px">Luego</button></div><div id="mzMsg" style="font-size:13px;margin-top:6px"></div>';
    document.body.appendChild(d);
    document.getElementById("mzLuego").onclick=function(){try{sessionStorage.setItem("mudanzaLuego","1")}catch(e){}d.remove()};
    var b=document.getElementById("mzMudar");if(b)b.onclick=function(){b.disabled=true;b.textContent="Preparando…";mudar().catch(function(e){b.disabled=false;b.textContent="Reintentar";document.getElementById("mzMsg").textContent="No se pudo: "+e.message})};
  }
  function leerIDB(){return new Promise(function(res){var out={};try{var o=indexedDB.open("mazos-oposicion",1);o.onupgradeneeded=function(){o.result.createObjectStore("kv")};o.onerror=function(){res(out)};o.onsuccess=function(){try{var c=o.result.transaction("kv").objectStore("kv").openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=function(){res(out)}}catch(e){res(out)}}}catch(e){res(out)}})}
  async function mudar(){
    var ls={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(mazosOposicion\.|todo\.|fcOpts$)/.test(k)&&k!==HECHO)ls[k]=localStorage.getItem(k)}
    var idb=await leerIDB();
    var code=Array.from(crypto.getRandomValues(new Uint8Array(16)),function(x){return(x%36).toString(36)}).join("");
    var r=await fetch(FB+code+".json",{method:"PUT",body:JSON.stringify({t:Date.now(),json:JSON.stringify({ls:ls,idb:idb})})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    try{localStorage.setItem(HECHO,String(Date.now()))}catch(e){}
    location.href=NUEVO+"/traslado.html#"+code;
  }
})();
</script>
